# Dispatch daemon — registers a Linear webhook, tunnels it via cloudflared,
# and auto-routes new tickets to muaddib worker containers.
#
# Managed via dispatch.sh (which sets HOST_FLEET_DIR automatically):
#   npm run muaddib:start   →  dispatch.sh --bg   (detached, restart: unless-stopped)
#   npm run muaddib:stop    →  dispatch.sh --stop  (deregisters webhook, removes container)
#   docker compose -p <project>-dispatch -f muaddib/docker-compose.dispatch.yml logs -f
#
# Prerequisites — export in shell before muaddib:start:
#   CLAUDE_CODE_OAUTH_TOKEN  (claude setup-token)
#   GITHUB_TOKEN             (repo-scoped PAT for opening PRs)
# Dispatch-specific config goes in .muaddib/secrets.env (see .muaddib/secrets.env.example).

services:
  dispatch:
    build:
      context: ..
      dockerfile: muaddib/Dockerfile.dispatch
    image: ${MUADDIB_DISPATCH_IMAGE:?run via dispatch.sh — it sets MUADDIB_DISPATCH_IMAGE automatically}
    restart: unless-stopped
    env_file:
      - ../.muaddib/secrets.env
    environment:
      REPO_ROOT: /repo
      # Dispatch dedup ledger + queue. The container runs as root (HOME=/root)
      # and is recreated on restart, so writing to ~/.muaddib/<project>/ inside it
      # would be lost. Point the queue module at the mounted host dir (see the
      # volume below) so the ledger persists across container recreation.
      MUADDIB_DISPATCH_DIR: /dispatch-state
      # Also override the account dir to the same mounted host path. Without this,
      # read-config.sh (sourced by spawn-worker.sh when the daemon launches a
      # worker) would resolve MUADDIB_WORKERS_DIR under the container's /root/.muaddib,
      # so per-worker env files would land inside the ephemeral container — invisible
      # to the host teardown scripts. /dispatch-state is bind-mounted from the host.
      MUADDIB_ACCOUNT_DIR: /dispatch-state
      # HOST_FLEET_DIR: real path of muaddib/ on the host machine.
      # When spawn-worker.sh calls `docker compose` from inside this container,
      # Docker resolves volume mounts against the HOST filesystem, not the
      # container's bind-mount path. dispatch.sh sets this automatically.
      HOST_FLEET_DIR: ${HOST_FLEET_DIR:?run via dispatch.sh — it sets HOST_FLEET_DIR automatically}
      # Host-side paths passed through to spawn-worker.sh → worker compose file.
      HOST_DESKTOP: ${HOST_DESKTOP:-${HOME}/Desktop}
      HOST_TMPDIR: ${TMPDIR:-/tmp}
      CLAUDE_SKILLS_DIR: ${CLAUDE_SKILLS_DIR:-${HOME}/.claude/skills}
      # Auth tokens must be in the shell env; docker restart preserves the values
      # saved when the container was first created.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:?export CLAUDE_CODE_OAUTH_TOKEN before running muaddib:start}
      GITHUB_TOKEN: ${GITHUB_TOKEN:?export GITHUB_TOKEN before running muaddib:start}
      # LINEAR_* are required only for a Linear (webhook) ticket source — the JS
      # validateEnv() enforces the real per-source requirement at startup. Left
      # optional here so a github-configured daemon (watchMode 'poll') can start
      # without them.
      LINEAR_API_KEY: ${LINEAR_API_KEY:-}
      LINEAR_TEAM_ID: ${LINEAR_TEAM_ID:-}
      DISPATCH_PORT: ${DISPATCH_PORT:-3999}
    volumes:
      # Repo bind-mount: daemon and spawn-worker.sh read workflows, scripts, etc.
      # Status-file writes land on the host via this mount. (Per-worker .env files
      # now go to /dispatch-state — see MUADDIB_ACCOUNT_DIR above.)
      - ..:/repo
      # Host Docker socket: daemon calls `docker ps`; spawn-worker.sh calls
      # `docker compose up` to launch worker containers on the host daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Account-level per-project dir on the host, holding the dispatch dedup
      # ledger + queue (MUADDIB_DISPATCH_DIR above). Persists the ledger across
      # container recreation. dispatch.sh mkdir -p's the source first so it isn't
      # root-created with wrong ownership.
      - ${MUADDIB_ACCOUNT_DIR:?run via dispatch.sh — it sets MUADDIB_ACCOUNT_DIR automatically}:/dispatch-state
    working_dir: /repo/muaddib
