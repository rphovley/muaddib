set -g mouse on
set -g focus-events on

# Forward OSC-8 hyperlink escapes so links printed in a worker session (e.g.
# `gh pr create` URLs) stay clickable through herdr's pane. Requires tmux >=3.4.
set -as terminal-features ',*:hyperlinks'

# Runtime-written by worker-entrypoint.sh before the tmux server starts: rebinds
# the inner prefix off C-b so it doesn't collide with herdr's outer pane. `-q`
# keeps this harmless if the file is absent (a non-worker context reusing this conf).
source-file -q /home/worker/.tmux-prefix.conf
