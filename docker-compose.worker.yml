# One isolated worker stack. Namespaced per worker via `docker compose -p <projectName>-w<N>`.
# Ports/env come from spawn-worker.sh. Deliberately NO docker.sock mount and no
# host bind-mounts except the two narrow, intentional ones on `worker`.
#
# This file carries NO project-specific services or env vars — no DB sidecars,
# no app config contract. A project that needs those (a database, app-specific
# env vars, etc.) supplies its own overlay at `.muaddib/docker/docker-compose.worker.yml`,
# which spawn-worker.sh/teardown-worker.sh layer in via an extra `-f` when present.
# See README "Project compose overlay".
services:
  worker:
    image: ${MUADDIB_WORKER_IMAGE:-quotethat-worker:latest}
    build:
      context: .. # repo root, so the image can pre-install project deps
      dockerfile: muaddib/Dockerfile.worker
    env_file:
      - ${WORKER_ENV_FILE:?set WORKER_ENV_FILE} # GCP non-prod secrets + worker vars
    environment:
      WORKER_INDEX: "${WORKER_INDEX:?set WORKER_INDEX}"
      # NOTE: LAVISH_AXI_HOST is deliberately NOT set here. lavish-axi (the sketch
      # UI/UX prototyping loop) refuses to bind a wildcard like 0.0.0.0 and
      # downgrades it to loopback, which the published port below can't reach.
      # worker-entrypoint.sh instead binds lavish to the container's own routable
      # IP (see the LAVISH_AXI_HOST export there) so ${WORKER_SKETCH_PORT}:4387
      # actually reaches the listener.
      # The host-published sketch port for THIS worker — the sketch skill reads
      # this to build the operator-facing URL rather than recomputing it from a
      # port-base literal (the base is project config, not something the
      # container should know about).
      WORKER_SKETCH_PORT: "${WORKER_SKETCH_PORT:?set WORKER_SKETCH_PORT}"
    ports:
      - "${WORKER_API_PORT:?set WORKER_API_PORT}:8081" # agent's `npm run dev`
      - "${WORKER_SKETCH_PORT:?set WORKER_SKETCH_PORT}:4387" # sketch UI/UX prototyping loop
    volumes:
      # The ONLY host mounts. Both narrow and intentional:
      #  - status/ : tiny state files the hooks write, host watches (rw)
      #  - skills  : your personal Claude skills, read-only (no secrets)
      - ./status:/var/run/agent-status
      - ${CLAUDE_SKILLS_DIR:?set CLAUDE_SKILLS_DIR}:/home/worker/.claude/skills:ro
      - ${HOST_TMPDIR:?set HOST_TMPDIR}:${HOST_TMPDIR}:ro
      - ${HOST_DESKTOP:?set HOST_DESKTOP}:/home/worker/Desktop:ro
      - npm-cache:/home/worker/.npm
    tty: true
    stdin_open: true
    mem_limit: 6g
    cpus: 3.0
    pids_limit: 2048
    # NOTE: intentionally no /var/run/docker.sock — that would be root-on-host.

volumes:
  npm-cache:
